aid: dualentry
name: DualEntry
description: >-
  DualEntry is an AI-native ERP (enterprise resource planning) platform for
  finance and accounting teams, positioned as a modern replacement for NetSuite,
  QuickBooks, and Xero. It covers core financials (general ledger, accounts
  payable and receivable, cash management, bank and account reconciliation, tax,
  and month-end close), advanced accounting (ASC 606 revenue recognition,
  subscription billing, prepaid amortization, fixed-asset and multi-book
  depreciation), and enterprise scale (multi-entity consolidation, multi-currency,
  intercompany journal entries, budgeting, and reporting), layered with AI
  automation for categorization, anomaly detection, OCR document capture, and
  continuous close. Developers integrate through the DualEntry Public API (V1 and
  V2 REST), a hosted MCP server for AI assistants, a first-party Python CLI, and
  signed webhooks. The company raised a $90M Series A and is backed by GV, Khosla
  Ventures, and Lightspeed Venture Partners.
