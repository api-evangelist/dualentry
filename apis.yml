apis:
- name: DualEntry Public API
  description: >-
    REST API for programmatic access to an organization's accounting data across
    setup (accounts, items, classifications), master data (companies, customers,
    vendors), transactions (invoices, bills, journal entries, payments, purchase
    orders), and automation (recurring transactions, attachments). V2 adds
    depreciation books, intercompany journal entries, and multi-book fixed-asset
    depreciation. Authenticated with an X-API-KEY header; offset-based pagination;
    token-bucket rate limiting; signed webhooks for record lifecycle events.
  humanURL: https://docs.dualentry.com/developers/guides/index
